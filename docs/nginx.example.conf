# CreatorYard 本番配信の nginx 例（designs 2026-08-08 21:22 段階 B）。
# 静的書き出し（out/）を配りつつ、動的な部分だけ API（PORT 3010）へ通す。
# GAMEYARD と同じ「静的ホスティング＋小さな API」の分離。
#
# ドメインは 2026-08-09 22:19 に creatoryard.io を取得済み（社長）。
# DNS は Cloudflare（GAMEYARD と同じアカウント）。
#
# ## 雲の色は **オレンジ（プロキシ有効）**。A 案で決定（2026-08-09 23:35 社長）
#
# 一度「灰色雲（DNS only）にする」と書いたが**取り下げた**。外から
# play-game-yard.com を引くと Cloudflare の IP が返る（104.16.0.0/13・
# 172.64.0.0/13）。**GAMEYARD はオレンジ雲で動いていて origin の IP は
# 外から見えない**。CreatorYard を同じサーバーに置いて灰色雲にすると、
# creatoryard.io の A レコードからその IP が誰にでも引け、**CreatorYard の
# 都合で GAMEYARD の守りを下げる**ことになるため。
#
# オレンジ雲を選んだので、**「第三者 JS を入れない」は構成ではなく設定で
# 守る**ことになる。守るのは次の 2 つだけ:
#
#   1. Web Analytics に creatoryard.io を **追加しない**
#      （押さないことが操作。自動では入らないが、追加すると
#        static.cloudflareinsights.com の beacon がページに挿入される）
#   2. Speed → Settings → Content の **Rocket Loader を Off に保つ**
#
# **1 は実際に踏まれている罠**。この account では play-game-yard.com と
# gameyard-games.com の 2 件が「Automatic setup」で登録済みで、
# トップページに beacon が実際に入っている（2026-08-09 に本体を取得して確認）。
# **curl の既定 UA では入らず、ブラウザ風の UA にすると入る**ので、
# 「無い」と見えることがある。確かめるときは UA を付ける（事例 37）。
#
# ## SSL/TLS の暗号化モードは **Full (strict)**
#
# オレンジ雲にすると Cloudflare と origin の間の暗号化を別に決めることに
# なる（灰色雲なら存在しない論点）。Cloudflare 公式は「Full か
# Full (strict) を強く推奨」。**Flexible は Cloudflare→origin が平文**
# なので選ばない。
#
# **順番がある。**Full (strict) は origin に creatoryard.io の正規の
# 証明書があることが前提なので、**証明書を入れるのと同じ回に設定する**。
# 先に設定すると 526 になる。
#
# ## 実際の訪問者 IP は $remote_addr では取れない
#
# オレンジ雲だと nginx から見た $remote_addr は **Cloudflare の IP**。
# 訪問者の IP は Cloudflare が付ける CF-Connecting-IP にしか無い。
# **ただし信じてよいのは、接続元が本当に Cloudflare のときだけ**
# （origin に直接来た相手は同じヘッダを自由に名乗れる）。
# set_real_ip_from に Cloudflare の IP 帯を並べ、real_ip_header を
# CF-Connecting-IP にする形にする。**この設定を入れるまで、
# ログインのバックオフは効かない**（後述の designs 参照）。

server {
    listen 443 ssl;
    server_name creatoryard.io;

    root /var/www/creatoryard/out;
    index index.html;

    # Story 個別ページと個人ページは静的シェルに rewrite する。
    # 実体は /s/index.html・/w/index.html で、id / handle は
    # client 側が pathname から読む
    location ~ ^/s/[a-f0-9]{16}/?$ {
        try_files /s/index.html =404;
    }
    location ~ ^/w/[a-z0-9][a-z0-9_-]{2,31}/?$ {
        try_files /w/index.html =404;
    }
    # タグページ（軸で分けない /tags/<tag>/。designs 2026-08-09 00:22）
    location ~ ^/tags/[^/]+/?$ {
        try_files /tags/index.html =404;
    }

    # 書く側の API（登録・ログイン・Story の読み書き）
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        # CORS は同一オリジンになるため実質使われない（別オリジン開発時のみ）
    }

    # RSS（段階 C で API 側に実装）。公開 URL は購読の永続契約なので
    # この形から変えない（proposals 2026-08-08 21:12）
    location = /stories/feed.xml {
        proxy_pass http://127.0.0.1:3010/api/feeds/stories.xml;
    }
    location ~ ^/w/([a-z0-9][a-z0-9_-]{2,31})/feed\.xml$ {
        proxy_pass http://127.0.0.1:3010/api/feeds/w/$1.xml;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
