# CreatorYard 本番配信の nginx 例（designs 2026-08-08 21:22 段階 B）。
# 静的書き出し（out/）を配りつつ、動的な部分だけ API（PORT 3010）へ通す。
# GAMEYARD と同じ「静的ホスティング＋小さな API」の分離。
#
# ドメインは 2026-08-09 22:19 に creatoryard.io を取得済み（社長）。
# DNS は Cloudflare（GAMEYARD と同じアカウント）。
#
# ## 雲の色は **要判断**（2026-08-09 23:20・社長待ち）
#
# ここは一度「灰色雲（DNS only）にする」と書いたが、**そのままでは
# 進められないことが分かった**ので保留にしてある。
#
# 外から play-game-yard.com を引くと 104.21.55.228 / 172.67.173.204 が
# 返り、これは Cloudflare の公開 IP 一覧（104.16.0.0/13・172.64.0.0/13）に
# 入る。つまり **GAMEYARD は今オレンジ雲で動いていて、本当のサーバーの
# IP は外から見えない**。
#
# **CreatorYard を同じサーバーに置いて灰色雲にすると、creatoryard.io の
# A レコードから本当の IP が誰にでも引ける。**その IP は GAMEYARD の
# ものでもあるので、GAMEYARD が隠していたものが CreatorYard 経由で割れる。
# CreatorYard の都合で GAMEYARD の守りを下げることになる。
#
#   A. オレンジ雲に揃え、Rocket Loader と Web Analytics を Off にする（推奨）
#   B. 別のサーバーに置いて灰色雲にする（費用と手間が増える）
#   C. 灰色雲のまま同居（GAMEYARD の IP が割れる。採らない）
#
# A を推すのは、**GAMEYARD が既にオレンジ雲で本番稼働していて、
# 同じ「第三者 JS を入れない」方針で動いている**から。運用の実績が
# このアカウントに既にある。**決まるまで、この設定を本番に置かない。**
#
# 以下は灰色雲を選んだ場合の注意（A を選ぶなら「設定」で同じことを守る）。
# 灰色雲は「触らなければそうなる」ものではない。Cloudflare の公式が
# "Proxying is on by default when you onboard a domain via the dashboard"
# と書いているとおり、**既定はオレンジ雲**。A レコードを作った直後に
# DNS → Records の Proxy status の雲アイコンを押して灰色へ切り替える
# （2026-08-09 に公式で確認）。
#
# 灰色にしておく理由は証明書だけではない。**オレンジ雲だと Cloudflare が
# ページの中身を書き換えられる**ので、Web Analytics の「自動セットアップ」で
# HTML を触らずに計測用の JS を挿せてしまう（公式に明記）。灰色なら
# その経路が仕組み上できない（非プロキシは手で貼るしかない）。
# 「第三者 JS を入れない」「個人単位の行動計測をしない」を、設定ではなく
# 構成で守る形になる。
#
# 同じ理由で Speed → Settings → Content Optimization の Rocket Loader も
# Off のままにする（すべての JS の読み込みを描画後まで遅らせる機能）。
# 既定が On か Off かは公式に書かれていないので、目で見て確かめる。

server {
    listen 443 ssl;
    server_name creatoryard.io;

    root /var/www/creatoryard/out;
    index index.html;

    # Story 個別ページと個人ページは静的シェルに rewrite する。
    # 実体は /s/index.html・/w/index.html で、id / handle は
    # client 側が pathname から読む
    location ~ ^/s/[a-f0-9]{16}/?$ {
        try_files /s/index.html =404;
    }
    location ~ ^/w/[a-z0-9][a-z0-9_-]{2,31}/?$ {
        try_files /w/index.html =404;
    }
    # タグページ（軸で分けない /tags/<tag>/。designs 2026-08-09 00:22）
    location ~ ^/tags/[^/]+/?$ {
        try_files /tags/index.html =404;
    }

    # 書く側の API（登録・ログイン・Story の読み書き）
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        # CORS は同一オリジンになるため実質使われない（別オリジン開発時のみ）
    }

    # RSS（段階 C で API 側に実装）。公開 URL は購読の永続契約なので
    # この形から変えない（proposals 2026-08-08 21:12）
    location = /stories/feed.xml {
        proxy_pass http://127.0.0.1:3010/api/feeds/stories.xml;
    }
    location ~ ^/w/([a-z0-9][a-z0-9_-]{2,31})/feed\.xml$ {
        proxy_pass http://127.0.0.1:3010/api/feeds/w/$1.xml;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
